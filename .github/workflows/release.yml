name: Build & Release

# Every push to main builds the distributed mods that changed since the last release (all of
# them when shared code changed) for both SN and BZ, then publishes a single GitHub release
# tagged vX.Y.Z carrying their zips. A push that changes no mod makes no release. The version is a repo-wide
# 3-digit odometer (each digit 0-9): 2.0.9 -> 2.1.0, 2.9.9 -> 3.0.0. It lives in /VERSION,
# is bumped by this workflow, and committed back with [skip ci] (the GITHUB_TOKEN push does
# not retrigger CI either, so no loop).

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Only mods whose folder changed since the last release tag are rebuilt and attached. OpenMods
      # picks each mod's zip by name (releaseAssets) and skips a release that doesn't carry it, so the
      # other mods keep their current version. Shared code or build files changed: release everything.
      - name: Pick mods to release
        id: mods
        shell: pwsh
        run: |
          $all = 'AD3D_LightSolution', 'AD3D_EnergySolution', 'AD3D_StorageSolution', 'AD3D_IndustrySolution'
          $last = git describe --tags --abbrev=0 --match 'v*' 2>$null
          if (-not $last) {
            $pick = $all
          } else {
            # Store-page edits (.openmods/) sync to OpenMods on push without a new release
            $changed = @(git diff --name-only $last HEAD | Where-Object { $_ -notmatch '/\.openmods/' })
            $shared = $changed | Where-Object { $_ -match '^(AD3D_Common/|Libs/|Dependencies/|[^/]+\.(targets|props|sln)$)' }
            if ($shared) {
              $pick = $all
            } else {
              $pick = $all | Where-Object { $m = $_; $changed | Where-Object { $_.StartsWith("$m/") } }
            }
          }
          $list = @($pick) -join ','
          "list=$list" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($list) { Write-Host "Releasing: $list (changes since ${last})" } else { Write-Host "No mod changed since ${last}: no release" }

      - name: Compute next version
        id: ver
        if: steps.mods.outputs.list != ''
        shell: pwsh
        run: |
          $raw = (Get-Content VERSION -Raw).Trim()
          $p = $raw.Split('.')
          if ($p.Count -ne 3) { throw "VERSION must be X.Y.Z, got '$raw'" }
          $n = [int]$p[0] * 100 + [int]$p[1] * 10 + [int]$p[2] + 1
          $v = '{0}.{1}.{2}' -f [math]::Floor($n / 100), ([math]::Floor($n / 10) % 10), ($n % 10)
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $v"

      - name: Build & stage (SN + BZ)
        if: steps.mods.outputs.list != ''
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
          MODS: ${{ steps.mods.outputs.list }}
        run: |
          $mods = $env:MODS.Split(',')
          # Forward slashes + trailing slash: a trailing '\' before the closing quote would
          # escape it (MSBuild CLI quoting bug); '/' is accepted on Windows and is safe.
          $sln  = ($PWD.Path -replace '\\', '/') + '/'
          foreach ($m in $mods) {
            foreach ($cfg in 'SN', 'BZ') {
              Write-Host "::group::build $m $cfg"
              dotnet build "$m/$m.csproj" -c $cfg -p:Version=$env:VER "-p:SolutionDir=$sln" --nologo
              if ($LASTEXITCODE -ne 0) { throw "build failed: $m $cfg" }
              Write-Host "::endgroup::"
            }
          }

      - name: Zip artifacts
        if: steps.mods.outputs.list != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $distFull = (Resolve-Path dist).Path
          $staged = Get-ChildItem -Path artifacts -Directory -Recurse -Depth 1 |
            Where-Object { $_.Name -match '\.(SN|BZ)$' }
          if (-not $staged) { throw "no staged mod folders under artifacts/" }
          # 7-Zip matches the local post-build (-tzip -mx9, forward-slash entries) so CI
          # zips are identical to historical releases. Fall back to Compress-Archive (pwsh 7
          # also writes spec-compliant forward slashes) if the runner lacks 7-Zip.
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          foreach ($d in $staged) {
            $zip = Join-Path $distFull ('{0}.zip' -f $d.Name)
            if (Test-Path $zip) { Remove-Item $zip -Force }
            if (Test-Path $sevenZip) {
              & $sevenZip a -tzip $zip "$($d.FullName)\*" -mx9 -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7z failed for $($d.Name)" }
            } else {
              Compress-Archive -Path (Join-Path $d.FullName '*') -DestinationPath $zip
            }
            Write-Host "zipped $zip"
          }
          Get-ChildItem dist

      - name: Create GitHub release
        if: steps.mods.outputs.list != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $zips = (Get-ChildItem dist/*.zip).FullName
          gh release create $env:TAG @zips --title "Release $env:TAG" --generate-notes

      - name: Commit version bump
        if: steps.mods.outputs.list != ''
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          Set-Content -Path VERSION -Value $env:VER -NoNewline
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $env:VER [skip ci]"
          git -c rebase.autoStash=true pull --rebase origin main
          git push
